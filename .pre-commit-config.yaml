# OpenTofu (tofu) is the canonical IaC binary for this repo. The
# `terraform_*` hooks from antonbabenko/pre-commit-terraform honour
# PCT_TFPATH=tofu to dispatch to `tofu` instead of `terraform`. The Nix
# dev shell ships both binaries; the .envrc sets PCT_TFPATH so the
# OpenTofu lockfile format (registry.opentofu.org/...) stays canonical
# whether checks run locally or in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '\.github/workflows/.*\.lock\.yml$'
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      # terraform_docs hook intentionally omitted: its output (markdown table
      # formatter) mixes "aligned" and "compact" table styles in the README,
      # which markdownlint v0.40's MD060 (table-column-style) refuses across
      # the file even when the rule is set to false at config level. Input/
      # output documentation lives in variables.tf and outputs.tf descriptions
      # — adequate for a single-module repo.
      - id: terraform_tflint
        args:
          - --args=--only=terraform_deprecated_interpolation
          - --args=--only=terraform_deprecated_index
          - --args=--only=terraform_unused_declarations
          - --args=--only=terraform_comment_syntax
          - --args=--only=terraform_documented_outputs
          - --args=--only=terraform_documented_variables
          - --args=--only=terraform_typed_variables
          - --args=--only=terraform_module_pinned_source
          - --args=--only=terraform_naming_convention
          - --args=--only=terraform_required_version
          - --args=--only=terraform_required_providers
          - --args=--only=terraform_standard_module_structure
