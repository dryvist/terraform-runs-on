name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            terraform:
              - '**.tf'
              - '**.tfvars'
              - '.terraform.lock.hcl'
              - 'terragrunt.hcl'

  validate:
    name: OpenTofu Validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: opentofu/setup-opentofu@v2
      - name: OpenTofu Format
        run: tofu fmt -check
      - name: OpenTofu Init
        run: tofu init -backend=false
      - name: OpenTofu Validate
        run: tofu validate -no-color

  plan:
    name: OpenTofu Plan
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      # Suppress Terragrunt's own log lines (which echo state bucket / lock
      # table names) for all terragrunt steps in this job.
      TERRAGRUNT_LOG_DISABLE: "true"
      # Force terragrunt to invoke `tofu` instead of `terraform`. Lockfile
      # entries use `registry.opentofu.org/...` and only OpenTofu understands
      # them; without this, terragrunt picks up an implicit `terraform` on
      # PATH and rewrites the lockfile on every CI run.
      TERRAGRUNT_TFPATH: tofu
    steps:
      - name: Check Doppler Configuration
        id: check
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::warning::DOPPLER_TOKEN secret not configured — skipping plan (expected during initial bootstrap)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: steps.check.outputs.skip != 'true'
      - uses: opentofu/setup-opentofu@v2
        if: steps.check.outputs.skip != 'true'
      - name: Install terragrunt and tf-summarize via aqua
        if: steps.check.outputs.skip != 'true'
        uses: aquaproj/aqua-installer@v4.0.4
        with:
          aqua_version: v2.57.1
      - name: Fetch secrets from Doppler
        if: steps.check.outputs.skip != 'true'
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
      - name: Configure AWS Credentials
        if: steps.check.outputs.skip != 'true'
        id: creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.doppler.outputs.TERRAFORM_RUNS_ON_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          mask-aws-account-id: true
      - name: Terragrunt Init
        if: steps.check.outputs.skip != 'true'
        run: terragrunt init
      # Plan body is intentionally not echoed to the workflow log. On a
      # public repo the log is world-readable, and no regex-based mask
      # set can reliably redact AWS resource identifiers (API Gateway
      # IDs, S3 bucket names, function ARNs, etc.). See
      # docs/ci-plan-output-policy.md.
      - name: Terragrunt Plan (produce binary plan)
        if: steps.check.outputs.skip != 'true'
        env:
          # terragrunt.hcl reads these via get_env() to populate module inputs.
          # All values come from trusted Doppler step outputs (not user input).
          RUNSON_LICENSE_KEY: ${{ steps.doppler.outputs.RUNSON_LICENSE_KEY }}
          RUNSON_ALERT_EMAIL: ${{ steps.doppler.outputs.RUNSON_ALERT_EMAIL }}
          RUNSON_ALERT_SLACK_WEBHOOK_URL: ${{ steps.doppler.outputs.RUNSON_ALERT_SLACK_WEBHOOK_URL }}
        run: terragrunt plan -out=plan.tfplan -no-color > /dev/null

      # tf-summarize reads terraform's first-class JSON plan
      # representation and projects only resource addresses + actions.
      # change.before / change.after are never rendered, so resolved
      # attribute values cannot reach the PR comment.
      #
      # `success()` is required because a custom `if:` overrides
      # the default `if: success()` — without it, this step would
      # run even if Terragrunt Plan failed.
      - name: Summarize plan (structural projection)
        if: success() && steps.check.outputs.skip != 'true'
        run: terragrunt show -json plan.tfplan | tf-summarize -md > summary.md

      - name: Post plan summary on PR
        if: success() && steps.check.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: tf-plan-summary
          path: summary.md

  osv-scan:
    name: OSV Scan
    # OSV doesn't consume `needs.changes.outputs.*`, so no `needs:` is needed —
    # this lets the scan run in parallel with validate/plan.
    # Tracks dryvist/.github main — the canonical home for shared reusable
    # workflows. The previous SHA pin pointed at JacobPEvans-personal/.github
    # and does not exist in the dryvist hub, so the ref moved to @main.
    uses: dryvist/.github/.github/workflows/_osv-scan.yml@main
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      runner_label: ubuntu-latest

  gate:
    name: Merge Gate
    needs: [changes, validate, plan, osv-scan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: validate, plan
          jobs: ${{ toJSON(needs) }}
