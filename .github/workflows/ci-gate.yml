name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            terraform:
              - '**.tf'
              - '**.tfvars'
              - '.terraform.lock.hcl'
              - 'terragrunt.hcl'

  validate:
    name: Terraform Validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform Format
        run: terraform fmt -check
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate -no-color

  plan:
    name: Terraform Plan
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      # Suppress Terragrunt's own log lines (which echo state bucket / lock
      # table names) for all terragrunt steps in this job.
      TERRAGRUNT_LOG_DISABLE: "true"
    steps:
      - name: Check Doppler Configuration
        id: check
        env:
          DOPPLER_TOKEN: ${{ secrets.GH_ACTION_DOPPLER_IAC_CONF_MGMT }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::warning::GH_ACTION_DOPPLER_IAC_CONF_MGMT secret not configured — skipping plan (expected during initial bootstrap)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'
      - uses: hashicorp/setup-terraform@v4
        if: steps.check.outputs.skip != 'true'
      - name: Install terragrunt and tfcmt via aqua
        if: steps.check.outputs.skip != 'true'
        uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        with:
          aqua_version: v2.57.1
      - name: Fetch secrets from Doppler
        if: steps.check.outputs.skip != 'true'
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.GH_ACTION_DOPPLER_IAC_CONF_MGMT }}
          doppler-project: iac-conf-mgmt
          doppler-config: prd
      - name: Configure AWS Credentials
        if: steps.check.outputs.skip != 'true'
        id: creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.doppler.outputs.TERRAFORM_RUNS_ON_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          mask-aws-account-id: true
      - name: Terragrunt Init
        if: steps.check.outputs.skip != 'true'
        run: terragrunt init
      - name: Terragrunt Plan (via tfcmt)
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # terragrunt.hcl reads these via get_env() to populate module inputs.
          # All values come from trusted Doppler step outputs (not user input).
          RUNSON_LICENSE_KEY: ${{ steps.doppler.outputs.RUNSON_LICENSE_KEY }}
          RUNSON_ALERT_EMAIL: ${{ steps.doppler.outputs.RUNSON_ALERT_EMAIL }}
          RUNSON_ALERT_SLACK_WEBHOOK_URL: ${{ steps.doppler.outputs.RUNSON_ALERT_SLACK_WEBHOOK_URL }}
          # tfcmt replaces every regex match in stdout, stderr, AND the
          # posted comment body with `***`. Four patterns, `;;;` separator
          # (chosen so the resource-id pattern can use regex alternation):
          # 1. Bare 12-digit AWS account IDs (word-bounded so timestamp
          #    substrings inside longer digit runs don't match)
          # 2. Any arn:aws:* (IAM, Secrets Manager, EventBridge, Scheduler,
          #    SNS, SQS, AppRunner, EC2, etc.)
          # 3. 64-char hex hashes (Docker image manifest digests, RunsOn
          #    config hashes)
          # 4. AWS resource IDs with their standard short prefixes
          #    (vpc/subnet/sg/lt/i/ami/vol/snap/rtb/igw/nat/acl/eni/tgw/eip/eipalloc)
          TFCMT_MASKS_SEPARATOR: ";;;"
          TFCMT_MASKS: "regexp:\\b[0-9]{12}\\b;;;regexp:arn:aws:[^ \"]+;;;regexp:\\b[a-f0-9]{64}\\b;;;regexp:\\b(vpc|subnet|sg|lt|i|ami|vol|snap|rtb|igw|nat|acl|eni|tgw|eip|eipalloc)-[a-f0-9]{8,17}\\b"
        # tfcmt runs `terragrunt plan`, captures its output, applies the
        # masks, and posts the (masked) result as a PR comment via the
        # GitHub API. `-patch` (plan-subcommand flag) updates the previous
        # plan comment on this PR instead of stacking new ones on every
        # push. Exit code from `terragrunt plan` propagates through tfcmt,
        # so plan failures still fail the job.
        run: tfcmt plan -patch -- terragrunt plan -no-color

  gate:
    name: Merge Gate
    needs: [changes, validate, plan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: validate, plan
          jobs: ${{ toJSON(needs) }}
