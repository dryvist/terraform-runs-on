name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            terraform:
              - '**.tf'
              - '**.tfvars'
              - '.terraform.lock.hcl'
              - 'terragrunt.hcl'

  validate:
    name: Terraform Validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform Format
        run: terraform fmt -check
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate -no-color

  plan:
    name: Terraform Plan
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Check Doppler Configuration
        id: check
        env:
          DOPPLER_TOKEN: ${{ secrets.GH_ACTION_DOPPLER_IAC_CONF_MGMT }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::warning::GH_ACTION_DOPPLER_IAC_CONF_MGMT secret not configured — skipping plan (expected during initial bootstrap)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'
      - uses: hashicorp/setup-terraform@v4
        if: steps.check.outputs.skip != 'true'
      - name: Install Terragrunt
        if: steps.check.outputs.skip != 'true'
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: gruntwork-io/terragrunt
          tag: v1.0.0
          extension-matching: disable
          rename-to: terragrunt
          chmod: 0755
      - name: Install tfcmt
        if: steps.check.outputs.skip != 'true'
        # tfcmt's release tarball includes a third_party_licenses tree with
        # colliding LICENSE filenames that break jaxxstorm/action-install-gh-
        # release's recursive binary install. Extract just the tfcmt binary.
        run: curl -sSLf https://github.com/suzuki-shunsuke/tfcmt/releases/download/v4.14.15/tfcmt_linux_amd64.tar.gz | tar xz -C /usr/local/bin tfcmt
      - name: Fetch secrets from Doppler
        if: steps.check.outputs.skip != 'true'
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.GH_ACTION_DOPPLER_IAC_CONF_MGMT }}
          doppler-project: iac-conf-mgmt
          doppler-config: prd
      - name: Configure AWS Credentials
        if: steps.check.outputs.skip != 'true'
        id: creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.doppler.outputs.TERRAFORM_RUNS_ON_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          mask-aws-account-id: true
      - name: Terragrunt Init
        if: steps.check.outputs.skip != 'true'
        run: terragrunt init
      - name: Terragrunt Plan (via tfcmt)
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNSON_LICENSE_KEY: ${{ steps.doppler.outputs.RUNSON_LICENSE_KEY }}
          # Terragrunt's default timestamp prefix breaks tfcmt's terraform
          # output parser. Disable it so tfcmt sees clean terraform text.
          TERRAGRUNT_LOG_DISABLE: "true"
          # tfcmt replaces every regex match in stdout, stderr, AND the
          # posted comment body with `***`. Patterns cover every structural
          # identifier that could leak into plan output on this repo:
          # bare 12-digit AWS account IDs, any arn:aws:* (IAM roles,
          # Secrets Manager, EventBridge, Scheduler, SNS, SQS, AppRunner),
          # 64-char hex hashes (Docker image digests and RunsOn config
          # hashes), and aws- resource IDs like vpc-* and sg-*. Pipe is
          # an unambiguous separator since none of these patterns contain
          # a pipe character.
          TFCMT_MASKS_SEPARATOR: "|"
          TFCMT_MASKS: "regexp:\\b[0-9]{12}\\b|regexp:arn:aws:[^ \"]+|regexp:\\b[a-f0-9]{64}\\b|regexp:vpc-[a-f0-9]{8,17}|regexp:sg-[a-f0-9]{8,17}"
        # tfcmt runs `terragrunt plan`, captures its output, applies the
        # masks, and posts the (masked) result as a PR comment via the
        # GitHub API. `-patch` (plan-subcommand flag) updates the previous
        # plan comment on this PR instead of stacking new ones on every
        # push. Exit code from `terragrunt plan` propagates through tfcmt,
        # so plan failures still fail the job.
        run: tfcmt plan -patch -- terragrunt plan -no-color

  gate:
    name: Merge Gate
    needs: [changes, validate, plan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: validate, plan
          jobs: ${{ toJSON(needs) }}
