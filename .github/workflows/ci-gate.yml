name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            terraform:
              - '**.tf'
              - '**.tfvars'
              - '.terraform.lock.hcl'
              - 'terragrunt.hcl'

  validate:
    name: Terraform Validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform Format
        run: terraform fmt -check
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate -no-color

  plan:
    name: Terraform Plan
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Check Doppler Configuration
        id: check
        env:
          DOPPLER_TOKEN: ${{ secrets.GH_ACTION_DOPPLER_IAC_CONF_MGMT }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::warning::GH_ACTION_DOPPLER_IAC_CONF_MGMT secret not configured — skipping plan (expected during initial bootstrap)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'
      - uses: hashicorp/setup-terraform@v4
        if: steps.check.outputs.skip != 'true'
      - name: Install Terragrunt
        if: steps.check.outputs.skip != 'true'
        env:
          TG_VERSION: v1.0.0
        run: .github/scripts/install-terragrunt.sh
      - name: Fetch secrets from Doppler
        if: steps.check.outputs.skip != 'true'
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.GH_ACTION_DOPPLER_IAC_CONF_MGMT }}
          doppler-project: iac-conf-mgmt
          doppler-config: prd
      - name: Configure AWS Credentials
        if: steps.check.outputs.skip != 'true'
        id: creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.doppler.outputs.TERRAFORM_RUNS_ON_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          mask-aws-account-id: true
      - name: Terragrunt Init
        if: steps.check.outputs.skip != 'true'
        run: terragrunt init
      - name: Terragrunt Plan
        if: steps.check.outputs.skip != 'true'
        id: plan
        env:
          RUNSON_LICENSE_KEY: ${{ steps.doppler.outputs.RUNSON_LICENSE_KEY }}
        run: terragrunt plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
      - name: Scrub plan output before posting
        if: steps.check.outputs.skip != 'true' && github.event_name == 'pull_request'
        env:
          AWS_ACCOUNT_ID: ${{ steps.creds.outputs.aws-account-id }}
        run: .github/scripts/scrub-plan-output.sh plan_output.txt
      - name: Post Plan to PR
        if: steps.check.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8').slice(-60000);
            const output = `#### Terraform Plan
            <details><summary>Show Plan</summary>

            \`\`\`
            ${plan}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  gate:
    name: Merge Gate
    needs: [changes, validate, plan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: validate, plan
          jobs: ${{ toJSON(needs) }}
