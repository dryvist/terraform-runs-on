name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            terraform:
              - '**.tf'
              - '**.tfvars'
              - '.terraform.lock.hcl'

  validate:
    name: OpenTofu Validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      - name: OpenTofu Format
        run: tofu fmt -check
      - name: OpenTofu Init
        run: tofu init -backend=false
      - name: OpenTofu Validate
        run: tofu validate -no-color

  osv-scan:
    name: OSV Scan
    # OSV doesn't consume `needs.changes.outputs.*`, so no `needs:` is needed —
    # this lets the scan run in parallel with validate/plan.
    # Tracks dryvist/.github main — the canonical home for shared reusable
    # workflows. The previous SHA pin pointed at JacobPEvans-personal/.github
    # and does not exist in the dryvist hub, so the ref moved to @main.
    uses: dryvist/.github/.github/workflows/_osv-scan.yml@main
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      runner_label: ubuntu-latest

  gate:
    name: Merge Gate
    needs: [changes, validate, osv-scan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: validate
          jobs: ${{ toJSON(needs) }}
