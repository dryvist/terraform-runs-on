name: Smoke test RunsOn runner

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: smoke-runner-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    runs-on: "runs-on=${{ github.run_id }}/runner=2cpu-linux-x64"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show runner info
        run: |
          echo "=== uname ==="
          uname -a
          echo
          echo "=== arch ==="
          uname -m
          echo
          echo "=== cpus ==="
          nproc
          echo
          echo "=== memory ==="
          free -h
          echo
          echo "=== disk ==="
          df -h /
          echo
          echo "=== env (filtered) ==="
          env | grep -E '^(RUNNER_|GITHUB_|CI|HOSTNAME)=' | sort

      - name: Ping healthchecks.io
        env:
          # PING_KEY is the project-level identifier and is sensitive — stored
          # as a repo secret. SLUG is the check name within that project, safe
          # to expose as a repo var.
          HC_KEY: ${{ secrets.HEALTHCHECK_PING_KEY }}
          HC_SLUG: ${{ vars.HEALTHCHECK_SLUG_RUNSON }}
        run: curl -fsS --retry 3 --connect-timeout 5 --max-time 10 "https://hc-ping.com/$HC_KEY/$HC_SLUG"
