name: Smoke test RunsOn runner

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    runs-on: runs-on,runner=2cpu-linux-x64,family=c7+m7
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "=== uname ==="
          uname -a
          echo
          echo "=== arch ==="
          uname -m
          echo
          echo "=== cpus ==="
          nproc
          echo
          echo "=== memory ==="
          free -h
          echo
          echo "=== disk ==="
          df -h /
          echo
          echo "=== env (filtered) ==="
          env | grep -E '^(RUNNER_|GITHUB_|CI|HOSTNAME)=' | sort
